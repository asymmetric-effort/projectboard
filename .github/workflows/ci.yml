name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195f2ed94f1cefd752ca # v4.4.0
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Typecheck UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Typecheck API
        working-directory: api
        run: npx tsc --noEmit

      - name: Lint UI
        working-directory: ui
        run: npx prettier --check src/

      - name: Lint API
        working-directory: api
        run: npx prettier --check src/

  test:
    name: Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195f2ed94f1cefd752ca # v4.4.0
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Test API
        working-directory: api
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195f2ed94f1cefd752ca # v4.4.0
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npx vite build

      - name: Verify build output
        working-directory: ui
        run: test -f dist/index.html

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195f2ed94f1cefd752ca # v4.4.0
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
